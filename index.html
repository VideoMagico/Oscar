<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
}

/* video oculto */
#videoContainer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
justify-content:center;
align-items:center;
background:black;
}

video{
max-width:100%;
max-height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="videoContainer">
<video autoplay muted loop playsinline id="video">
<source src="Oscar.mp4" type="video/mp4">
</video>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let puntos = [];

function start(e){
puntos = [];
}

function move(e){
let x = e.touches ? e.touches[0].clientX : e.clientX;
let y = e.touches ? e.touches[0].clientY : e.clientY;

puntos.push({x,y});
}

function end(){
if(validarR(puntos)){
desbloquear();
}
}

// detectar gesto tipo "R" (simplificado)
function validarR(p){

if(p.length < 20) return false;

// inicio arriba
let inicio = p[0];
let medio = p[Math.floor(p.length/2)];
let fin = p[p.length-1];

// condición básica:
// baja → sube/curva → baja en diagonal
let baja = fin.y > inicio.y;
let curva = medio.x > inicio.x;

return baja && curva;
}

function desbloquear(){
document.getElementById("canvas").style.display="none";
document.getElementById("videoContainer").style.display="flex";
}

// eventos táctiles
canvas.addEventListener("touchstart", start);
canvas.addEventListener("touchmove", move);
canvas.addEventListener("touchend", end);

// mouse (PC)
canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", end);

</script>

<script data-goatcounter="https://fotomagica.goatcounter.com/count"
async src="//gc.zgo.at/count.js"></script>

</body>
</html>
