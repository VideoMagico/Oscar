<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso privado</title>

<style>

body{
margin:0;
background:#000;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* pantalla acceso */

#login{
text-align:center;
}

h1{
font-weight:300;
letter-spacing:3px;
margin-bottom:40px;
}

.pin{
display:flex;
gap:10px;
justify-content:center;
}

.pin input{
width:55px;
height:65px;
font-size:2rem;
text-align:center;
border:none;
border-radius:6px;
background:#111;
color:white;
}

button{
margin-top:35px;
padding:12px 30px;
background:#222;
color:white;
border:none;
border-radius:5px;
font-size:1rem;
}

#error{
margin-top:20px;
opacity:0.7;
}

/* video */

#videoContainer{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
}

video{
max-width:100%;
max-height:100%;
object-fit:contain;
}

.mensaje{
position:absolute;
bottom:40px;
letter-spacing:2px;
font-size:1.1rem;
opacity:0.8;
}

.sonido{
position:absolute;
top:30px;
font-size:0.8rem;
opacity:0.6;
}

</style>
</head>

<body>

<div id="login">

<h1>ACCESO PRIVADO</h1>

<div class="pin">
<input maxlength="1" id="p1">
<input maxlength="1" id="p2">
<input maxlength="1" id="p3">
<input maxlength="1" id="p4">
</div>

<button onclick="verificar()">Entrar</button>

<div id="error"></div>

</div>

<div id="videoContainer">

<video autoplay muted loop playsinline id="video">
<source src="Oscar.mp4" type="video/mp4">
</video>

<div class="mensaje">
UN MOMENTO QUE VIVE PARA SIEMPRE
</div>

<div class="sonido">
Toca la pantalla para activar sonido
</div>

</div>

<script>

const codigoCorrecto="1234";

function verificar(){

let codigo=
document.getElementById("p1").value+
document.getElementById("p2").value+
document.getElementById("p3").value+
document.getElementById("p4").value;

if(codigo===codigoCorrecto){

document.getElementById("login").style.display="none";
document.getElementById("videoContainer").style.display="flex";

}else{

document.getElementById("error").innerText="Código incorrecto";

}

}

const video=document.getElementById("video");

document.body.addEventListener("click",function(){
video.muted=false;
video.play();
});

</script>

<script data-goatcounter="https://fotomagica.goatcounter.com/count"
async src="//gc.zgo.at/count.js"></script>

</body>
</html>
