<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
}

/* video oculto */
#videoContainer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
justify-content:center;
align-items:center;
background:black;
}

video{
max-width:100%;
max-height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="videoContainer">
<video autoplay muted loop playsinline id="video">
<source src="Oscar.mp4" type="video/mp4">
</video>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let puntos = [];

function start(e){
puntos = [];
}

function move(e){
let x = e.touches ? e.touches[0].clientX : e.clientX;
let y = e.touches ? e.touches[0].clientY : e.clientY;

puntos.push({x,y});
}

function end(){
if(validarR(puntos)){
desbloquear();
}
}

// detectar gesto tipo "R" (simplificado)
function validarR(p){

if(p.length < 40) return false;

// calcular cambios de dirección
let cambiosDireccion = 0;

for(let i = 2; i < p.length; i++){
  let dx1 = p[i-1].x - p[i-2].x;
  let dy1 = p[i-1].y - p[i-2].y;
  let dx2 = p[i].x - p[i-1].x;
  let dy2 = p[i].y - p[i-1].y;

  let cambio = Math.abs(dx1 - dx2) + Math.abs(dy1 - dy2);

  if(cambio > 15){
    cambiosDireccion++;
  }
}

// desplazamientos totales
let inicio = p[0];
let fin = p[p.length - 1];

let desplazamientoY = fin.y - inicio.y;
let desplazamientoX = fin.x - inicio.x;

// condiciones más estrictas
let baja = desplazamientoY > 100;      // tiene que bajar bastante
let derecha = desplazamientoX > 50;    // tiene que ir hacia la derecha
let forma = cambiosDireccion > 10;     // debe tener curva

return baja && derecha && forma;
}

function desbloquear(){
document.getElementById("canvas").style.display="none";
document.getElementById("videoContainer").style.display="flex";
}
const video = document.getElementById("video");

video.onended = function(){
  document.body.style.background = "black";
  video.style.display = "none";
};
// eventos táctiles
canvas.addEventListener("touchstart", start);
canvas.addEventListener("touchmove", move);
canvas.addEventListener("touchend", end);

// mouse (PC)
canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", move);
canvas.addEventListener("mouseup", end);

</script>

<script data-goatcounter="https://fotomagica.goatcounter.com/count"
async src="//gc.zgo.at/count.js"></script>

</body>
</html>
